<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>07 - CSS Positioning</title>
    <style>
        body { font-family: sans-serif; height: 1500px; padding: 20px; }
        .relative-box { position: relative; top: 10px; left: 20px; background: #e74c3c; color: white; padding: 15px; width: 250px; }
        .absolute-box { position: absolute; top: 10px; right: 10px; background: #9b59b6; color: white; padding: 10px; }
        .fixed-box { position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 15px; border-radius: 30px; }
        .sticky-box { position: sticky; top: 0; background: #f1c40f; padding: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sticky-box">Sticky Header (Stays at top while scrolling)</div>
    <h1>Positioning Demo</h1>
    <div class="relative-box">
        Relative Box
        <div class="absolute-box">Absolute</div>
    </div>
    <div class="fixed-box">Fixed Badge</div>
</body>
</html>
