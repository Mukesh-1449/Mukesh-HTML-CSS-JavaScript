<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>48 - Two Column Layout</title>
    <style>
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; font-family: sans-serif; padding: 20px; }
        .main { background: #e0f7fa; padding: 20px; }
        .sidebar { background: #fff3e0; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main"><h2>Main Article Area (2fr)</h2></div>
        <div class="sidebar"><h3>Sidebar (1fr)</h3></div>
    </div>
</body>
</html>
