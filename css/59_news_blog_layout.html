<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>59 - News Grid</title>
    <style>
        .news-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px; font-family: sans-serif; }
        .main-article { background: #eee; padding: 20px; }
        .side-news { background: #f9f9f9; padding: 15px; }
    </style>
</head>
<body>
    <div class="news-grid">
        <div class="main-article"><h1>Breaking News Article</h1></div>
        <div class="side-news"><h3>Top Headlines</h3></div>
    </div>
</body>
</html>
