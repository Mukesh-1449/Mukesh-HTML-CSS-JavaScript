<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>51 - Fixed Sidebar</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .sidebar { position: fixed; top: 0; left: 0; width: 200px; height: 100vh; background: #1a252f; color: white; padding: 20px; box-sizing: border-box; }
        .content { margin-left: 200px; padding: 20px; height: 1200px; }
    </style>
</head>
<body>
    <div class="sidebar"><h3>Fixed Sidebar</h3></div>
    <div class="content"><h1>Main Content</h1><p>Scroll down...</p></div>
</body>
</html>
