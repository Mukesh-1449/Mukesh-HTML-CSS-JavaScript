<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>65 - CSS Transitions</title>
    <style>
        .box { width: 100px; height: 100px; background: #e84393; transition: width 0.5s ease-in-out, background-color 0.5s; }
        .box:hover { width: 300px; background: #00b894; }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
