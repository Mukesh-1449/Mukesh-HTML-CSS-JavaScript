<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>74 - Calc Function</title>
    <style>
        .sidebar { width: 200px; float: left; background: #eee; height: 100vh; }
        .content { width: calc(100% - 200px); float: left; background: #e0f7fa; height: 100vh; font-family: sans-serif; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="sidebar">Sidebar 200px</div>
    <div class="content">Content width: calc(100% - 200px)</div>
</body>
</html>
