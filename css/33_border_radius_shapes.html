<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>33 - Border Radius Shapes</title>
    <style>
        body { display: flex; gap: 20px; padding: 40px; }
        .circle { width: 100px; height: 100px; background: #e74c3c; border-radius: 50%; }
        .pill { width: 150px; height: 60px; background: #2ecc71; border-radius: 30px; }
        .leaf { width: 100px; height: 100px; background: #f1c40f; border-radius: 0 50px 0 50px; }
    </style>
</head>
<body>
    <div class="circle"></div>
    <div class="pill"></div>
    <div class="leaf"></div>
</body>
</html>
