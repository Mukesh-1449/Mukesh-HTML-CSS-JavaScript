<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>34 - Opacity & Transparency</title>
    <style>
        body { font-family: sans-serif; background: url('https://via.placeholder.com/600x400') no-repeat; padding: 40px; }
        .opacity-box { background: #000; opacity: 0.6; color: white; padding: 20px; margin-bottom: 20px; }
        .rgba-box { background: rgba(0, 0, 0, 0.6); color: white; padding: 20px; }
    </style>
</head>
<body>
    <div class="opacity-box"><p>Opacity affects entire element and children (0.6)</p></div>
    <div class="rgba-box"><p>RGBA affects background transparency only (0.6)</p></div>
</body>
</html>
