<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>46 - Flexbox Card Layout</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1 1 250px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card"><h3>Card 1</h3><p>Flex item scaling dynamically.</p></div>
        <div class="card"><h3>Card 2</h3><p>Flex item scaling dynamically.</p></div>
        <div class="card"><h3>Card 3</h3><p>Flex item scaling dynamically.</p></div>
    </div>
</body>
</html>
