<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>14 - Flexbox Demo</title>
    <style>
        .flex-container { display: flex; justify-content: space-around; align-items: center; background-color: #2c3e50; padding: 20px; height: 200px; border-radius: 8px; }
        .flex-item { background: #e74c3c; color: white; padding: 20px; border-radius: 5px; font-weight: bold; font-family: sans-serif; }
    </style>
</head>
<body>
    <h2>Flexbox Layout</h2>
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>
</body>
</html>
