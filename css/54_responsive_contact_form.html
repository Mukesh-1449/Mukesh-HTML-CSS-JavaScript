<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>54 - Contact Form</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f9f9f9; }
        form { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
        textarea, input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #2ecc71; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <form>
        <h2>Contact Us</h2>
        <input type="text" placeholder="Name">
        <textarea rows="4" placeholder="Message"></textarea>
        <button type="button">Send</button>
    </form>
</body>
</html>
