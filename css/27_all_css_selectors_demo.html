<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>27 - All CSS Selectors</title>
    <style>
        * { box-sizing: border-box; } /* Universal */
        p { font-size: 1rem; } /* Element */
        .highlight { background: yellow; } /* Class */
        #main-title { color: purple; } /* ID */
        [data-status="active"] { color: green; font-weight: bold; } /* Attribute */
        h1, h2, p { font-family: Arial, sans-serif; } /* Grouping */
    </style>
</head>
<body>
    <h1 id="main-title">27 - Selectors Overview</h1>
    <p class="highlight">Class selector paragraph</p>
    <p data-status="active">Attribute selector targeted item</p>
</body>
</html>
