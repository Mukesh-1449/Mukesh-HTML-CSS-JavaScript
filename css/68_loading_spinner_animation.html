<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>68 - Loading Spinner</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #2d3436; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #0984e3; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
</body>
</html>
