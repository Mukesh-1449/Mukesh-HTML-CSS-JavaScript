<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>64 - Mobile First Design</title>
    <style>
        /* Base styles for mobile */
        body { font-family: sans-serif; padding: 10px; background: #ffeaa7; }
        /* Desktop enhancement */
        @media (min-width: 768px) {
            body { background: #81ecec; padding: 40px; }
        }
    </style>
</head>
<body>
    <h1>Mobile First Approach</h1>
    <p>Default layout targeted for mobile screens, scaled up with min-width media queries.</p>
</body>
</html>
