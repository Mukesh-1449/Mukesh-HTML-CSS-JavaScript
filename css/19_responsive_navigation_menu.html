<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19 - Responsive Nav</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .nav { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px 20px; }
        .nav-links { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        .nav-links a { color: white; text-decoration: none; }
        @media (max-width: 600px) { .nav-links { flex-direction: column; width: 100%; display: none; } .nav.active .nav-links { display: flex; } }
    </style>
</head>
<body>
    <div class="nav">
        <div>Logo</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</body>
</html>
