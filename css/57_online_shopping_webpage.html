<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>57 - Shopping Store</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .item { border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
    <h2>Store Catalog</h2>
    <div class="grid">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
    </div>
</body>
</html>
