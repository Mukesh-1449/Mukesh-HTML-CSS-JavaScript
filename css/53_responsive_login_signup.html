<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>53 - Login/Signup Tabs</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px; background: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign In / Up</h2>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button class="btn">Submit</button>
    </div>
</body>
</html>
