<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>31 - Linear & Radial Gradients</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 40px; }
        .linear { width: 200px; height: 150px; background: linear-gradient(to right, #ff416c, #ff4b2b); color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .radial { width: 200px; height: 150px; background: radial-gradient(circle, #36d1dc, #5b86e5); color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="linear">Linear Gradient</div>
    <div class="radial">Radial Gradient</div>
</body>
</html>
