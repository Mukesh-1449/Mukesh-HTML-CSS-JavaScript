<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>35 - Overflow Properties</title>
    <style>
        .box { width: 200px; height: 100px; border: 2px solid #333; padding: 10px; font-family: sans-serif; float: left; margin-right: 20px; }
        .scroll { overflow: scroll; }
        .auto { overflow: auto; }
        .hidden { overflow: hidden; }
    </style>
</head>
<body>
    <div class="box scroll">Scroll: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio. Praesent libero.</div>
    <div class="box auto">Auto: Dynamic content scrollbar when necessary.</div>
    <div class="box hidden">Hidden: Text that overflows is clipped completely out of sight.</div>
</body>
</html>
