<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>10 - Pseudo Classes</title>
    <style>
        body { font-family: sans-serif; padding: 30px; }
        .btn { padding: 12px 24px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #2980b9; transform: translateY(-2px); }
        .btn:active { background: #1f618d; transform: translateY(0); }
        input:focus { outline: 2px solid #e74c3c; background: #fdf2e9; }
        a:visited { color: #8e44ad; }
    </style>
</head>
<body>
    <h2>Pseudo-Classes Demo</h2>
    <button class="btn">Hover & Click Me</button><br><br>
    <input type="text" placeholder="Click to Focus"><br><br>
    <a href="https://example.com" target="_blank">Sample Visited Link</a>
</body>
</html>
