<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>28 - Combinator Selectors</title>
    <style>
        div p { color: blue; } /* Descendant */
        div > span { color: red; font-weight: bold; } /* Direct Child */
        h2 + p { color: green; } /* Adjacent Sibling */
        h2 ~ p { font-style: italic; } /* General Sibling */
    </style>
</head>
<body>
    <div><span>Direct Child Span</span><p>Descendant Paragraph</p></div>
    <h2>Heading</h2>
    <p>Adjacent sibling paragraph (Immediate next)</p>
    <p>General sibling paragraph</p>
</body>
</html>
