<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>70 - CSS Only Modal</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal:target { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; position: relative; }
        .close { position: absolute; top: 10px; right: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <a href="#demo-modal">Open Modal</a>
    <div id="demo-modal" class="modal">
        <div class="modal-content">
            <a href="#" class="close">&times;</a>
            <h2>Pure CSS Modal</h2>
            <p>This modal works without JavaScript using :target pseudo-class.</p>
        </div>
    </div>
</body>
</html>
