<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>73 - Clamp, Min, Max Functions</title>
    <style>
        .responsive-box {
            width: min(100%, 600px);
            font-size: clamp(1rem, 2.5vw, 2rem);
            background: #ffeaa7;
            padding: 20px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="responsive-box">
        Fluid font size using clamp(1rem, 2.5vw, 2rem) and max-width using min().
    </div>
</body>
</html>
