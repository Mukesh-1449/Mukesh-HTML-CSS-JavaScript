<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>03 - Colors, Backgrounds, Borders</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background-color: #f8f9fa; }
        .card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border: 4px dashed #ffdd59;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Gradient Background & Dashed Border</h2>
        <p>Demonstrates HEX/RGB colors, linear gradients, custom border styling, and subtle box-shadows.</p>
    </div>
</body>
</html>
