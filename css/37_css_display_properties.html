<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>37 - CSS Display Properties</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .block-elem { display: block; background: #e74c3c; color: white; padding: 10px; margin-bottom: 10px; }
        .inline-elem { display: inline; background: #f1c40f; padding: 10px; }
        .inline-block-elem { display: inline-block; width: 150px; height: 50px; background: #2ecc71; color: white; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="block-elem">Display Block (Full Width)</div>
    <span class="inline-elem">Display Inline 1</span>
    <span class="inline-elem">Display Inline 2</span><br><br>
    <div class="inline-block-elem">Inline-Block 1</div>
    <div class="inline-block-elem">Inline-Block 2</div>
</body>
</html>
