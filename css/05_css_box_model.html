<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>05 - CSS Box Model</title>
    <style>
        .box {
            width: 300px;
            padding: 25px;
            border: 8px solid #3498db;
            margin: 40px;
            background-color: #ecf0f1;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>Box Model Visualizer</h3>
        <p><strong>Content:</strong> Inner text area.<br><strong>Padding:</strong> 25px inside.<br><strong>Border:</strong> 8px solid blue.<br><strong>Margin:</strong> 40px outer space.</p>
    </div>
</body>
</html>
