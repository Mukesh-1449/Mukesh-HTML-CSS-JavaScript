<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>63 - Grid Media Queries</title>
    <style>
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-family: sans-serif; }
        .item { background: #00cec9; padding: 20px; text-align: center; color: white; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="grid">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
    </div>
</body>
</html>
