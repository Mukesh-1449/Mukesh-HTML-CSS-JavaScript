<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>49 - Three Column Flexbox</title>
    <style>
        .container { display: flex; gap: 15px; font-family: sans-serif; padding: 20px; }
        .col { flex: 1; padding: 20px; background: #f0f0f0; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="col">Column 1</div>
        <div class="col">Column 2</div>
        <div class="col">Column 3</div>
    </div>
</body>
</html>
