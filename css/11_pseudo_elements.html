<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>11 - Pseudo Elements</title>
    <style>
        body { font-family: Georgia, serif; padding: 30px; line-height: 1.8; }
        .quote::before { content: "“ "; font-size: 2rem; color: #e74c3c; }
        .quote::after { content: " ”"; font-size: 2rem; color: #e74c3c; }
        p::first-letter { font-size: 3rem; font-weight: bold; float: left; margin-right: 8px; color: #2c3e50; line-height: 1; }
        p::first-line { font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>
    <blockquote class="quote">Design is intelligence made visible.</blockquote>
    <p>This paragraph demonstrates ::first-letter drop cap styling along with ::first-line highlight formatting.</p>
</body>
</html>
