<!DOCTYPE html>
<html>
<head>
  <title>Table Example</title>
</head>
<body>
  <table border="1" cellpadding="10">
    <tr>
      <th colspan="2">Merged Header</th>
    </tr>
    <tr>
      <td>Row 1, Col 1</td>
      <td>Row 1, Col 2</td>
    </tr>
    <tr>
      <td rowspan="2">Merged Cell</td>
      <td>Row 2, Col 2</td>
    </tr>
    <tr>
      <td>Row 3, Col 2</td>
    </tr>
  </table>
</body>
</html>
